[package]
name = "kmesh"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "SSH-focused peer-to-peer connection and access service"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "kmesh"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.22"
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6.0"
ed25519-dalek = { version = "3.0", features = ["pem", "rand_core"] }
fs2 = "0.4"
futures-util = { version = "0.3", features = ["sink"] }
hmac = "0.13"
if-addrs = "0.13"
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto", "use_pem"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand = "0.10"
rcgen = { version = "0.14", features = ["ring"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "http2"] }
rpassword = "7.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
shlex = "1.3"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "uuid"] }
ssh-key = { version = "0.6.7", features = ["crypto"] }
thiserror = "2.0"
tokio = { version = "1.45", features = ["full"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.17", features = ["v4", "serde"] }
rtc-stun = "0.21"
