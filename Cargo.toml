[package]
name = "kmesh"
version = "0.2.2"
edition = "2024"
rust-version = "1.94"
description = "SSH-focused peer-to-peer connection and access service"
license = "MIT OR Apache-2.0"
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "kmesh"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.22"
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6.0"
ed25519-dalek = { version = "3.0", features = ["pem", "rand_core"] }
fs2 = "0.4"
futures-util = { version = "0.3", features = ["sink"] }
hmac = "0.13"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto", "use_pem"] }
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring", "unstable-net-report", "portmapper"] }
iroh-relay = { version = "=1.3.0", default-features = false, features = ["server", "tls-ring"] }
noq = { version = "=1.3.0", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand = "0.10"
rcgen = { version = "0.14", features = ["ring"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "http2"] }
rustyline = "18.0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"
semver = "1.0"
shadow-rs = { version = "2.0.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
shlex = "1.3"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "uuid"] }
ssh-key = { version = "0.6.7", features = ["crypto"] }
thiserror = "2.0"
tokio = { version = "1.45", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1.17", features = ["v4", "serde"] }
webpki-roots = "0.26"

[build-dependencies]
shadow-rs = "2.0.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2"

[patch.crates-io]
iroh-relay = { path = "vendor/iroh-relay" }
