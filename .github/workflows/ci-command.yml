name: CI command

on:
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [Rust CI]
    types: [completed]

permissions: {}

jobs:
  dispatch:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      startsWith(github.event.comment.body, '/ci')
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
      pull-requests: write
    steps:
      - name: Authorize and dispatch /ci
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { comment, issue, repository } = context.payload;
            if (comment.body.split(/\r?\n/, 1)[0].trim() !== '/ci') return;
            const { data: access } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner, repo, username: comment.user.login
            });
            if (!['write', 'maintain', 'admin'].includes(access.permission)) {
              core.notice('The /ci command requires repository write access.');
              return;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: issue.number
            });
            if (pr.state !== 'open') return;
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: 'ci.yml',
              ref: repository.default_branch,
              inputs: { pr_number: String(pr.number), sha: pr.head.sha }
            });
            await github.rest.reactions.createForIssueComment({
              owner, repo, comment_id: comment.id, content: 'rocket'
            });
            await github.rest.issues.createComment({
              owner, repo, issue_number: pr.number,
              body: `CI queued for \`${pr.head.sha}\`. [View CI runs](${context.serverUrl}/${owner}/${repo}/actions/workflows/ci.yml). Results will be posted here.`
            });

  report:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.path == '.github/workflows/ci.yml'
    runs-on: ubuntu-24.04
    permissions:
      statuses: write
      pull-requests: write
    steps:
      - name: Report CI result on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const match = /^PR #([1-9][0-9]*) \/ ([0-9a-f]{40})$/.exec(run.display_title);
            if (!match) throw new Error('Unexpected PR CI run title.');
            const [, number, sha] = match;
            const state = run.conclusion === 'success' ? 'success'
              : run.conclusion === 'failure' ? 'failure' : 'error';
            await github.rest.repos.createCommitStatus({
              owner, repo, sha, state, context: 'Rust CI',
              description: `CI ${run.conclusion}`,
              target_url: run.html_url
            });
            await github.rest.issues.createComment({
              owner, repo, issue_number: Number(number),
              body: `CI **${run.conclusion}** for \`${sha}\`. [View run](${run.html_url}) (attempt ${run.run_attempt}).`
            });
