name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked --all-targets

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            install-musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            install-musl: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
            install-musl: false
          - os: macos-15
            target: aarch64-apple-darwin
            install-musl: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl linker
        if: matrix.install-musl
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Verify the dependency graph has no OpenSSL TLS packages
        shell: bash
        run: |
          if cargo tree --locked --target "${{ matrix.target }}" --prefix none --format '{p}' \
            | grep -E '^[[:space:]]*(openssl-sys|openssl|openssl-src|native-tls)[[:space:]]v'; then
            echo 'An OpenSSL or native-tls package entered the dependency graph.'
            exit 1
          fi
      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: kmesh-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/kmesh
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [verify, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Verify release tag matches the package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "kmesh") | .version')"
          test "$RELEASE_TAG" = "v$package_version" || {
            echo "Release tag $RELEASE_TAG does not match package version v$package_version." >&2
            exit 1
          }
      - name: Package platform binaries
        shell: bash
        run: |
          mkdir release-assets
          for target in \
            x86_64-unknown-linux-musl \
            aarch64-unknown-linux-musl \
            x86_64-apple-darwin \
            aarch64-apple-darwin; do
            chmod +x "release-artifacts/kmesh-${target}/kmesh"
            tar -C "release-artifacts/kmesh-${target}" \
              -czf "release-assets/kmesh-${target}.tar.gz" kmesh
          done
      - name: Upload binaries to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/*.tar.gz --repo "$GH_REPO" --clobber
