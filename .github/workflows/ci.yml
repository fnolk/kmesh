name: Rust CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked --all-targets

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            install-musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            install-musl: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
            install-musl: false
          - os: macos-15
            target: aarch64-apple-darwin
            install-musl: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl linker
        if: matrix.install-musl
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Verify the dependency graph has no OpenSSL TLS packages
        shell: bash
        run: |
          if cargo tree --locked --target "${{ matrix.target }}" --prefix none --format '{p}' \
            | grep -E '^[[:space:]]*(openssl-sys|openssl|openssl-src|native-tls)[[:space:]]v'; then
            echo 'An OpenSSL or native-tls package entered the dependency graph.'
            exit 1
          fi
      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: kmesh-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/kmesh
          if-no-files-found: error
          retention-days: 14
