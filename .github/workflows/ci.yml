name: Rust CI

on:
  workflow_dispatch:
    inputs:
      mode:
        description: What to build
        type: choice
        options:
          - pull_request
          - release
        required: true
      pr_number:
        description: Open PR number (pull_request mode only)
        type: string
      release_tag:
        description: Published release tag (release mode only)
        type: string

permissions:
  contents: read

jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      mode: ${{ steps.target.outputs.mode }}
      release_tag: ${{ steps.target.outputs.release_tag }}
    steps:
      - name: Resolve and validate the requested source
        id: target
        uses: actions/github-script@v7
        env:
          MODE: ${{ inputs.mode }}
          PR_NUMBER: ${{ inputs.pr_number }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const mode = process.env.MODE;
            const prNumber = process.env.PR_NUMBER.trim();
            const tag = process.env.RELEASE_TAG.trim();
            let sha;
            if (mode === 'pull_request') {
              if (!/^[1-9][0-9]*$/.test(prNumber) || tag) {
                throw new Error('Provide only an open PR number for pull_request mode.');
              }
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: Number(prNumber)
              });
              if (pr.state !== 'open') throw new Error('The PR must be open.');
              sha = pr.head.sha;
            } else if (mode === 'release') {
              if (!tag || prNumber) {
                throw new Error('Provide only a published release tag for release mode.');
              }
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner, repo, tag
              });
              if (release.draft || !release.published_at) {
                throw new Error('The release must be published.');
              }
              const { data: commit } = await github.rest.repos.getCommit({
                owner, repo, ref: `refs/tags/${tag}`
              });
              sha = commit.sha;
              const { data: comparison } = await github.rest.repos.compareCommits({
                owner, repo, base: sha, head: 'main'
              });
              if (!['ahead', 'identical'].includes(comparison.status)) {
                throw new Error('The release commit must belong to main history.');
              }
              core.setOutput('release_tag', tag);
            } else {
              throw new Error('Unsupported build mode.');
            }
            core.setOutput('sha', sha);
            core.setOutput('mode', mode);

  verify:
    needs: resolve
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Set mTLS input paths
        shell: bash
        run: |
          printf 'KMESH_CA_CERT_PATH=%s/kmesh-mtls/ca-cert.pem\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'KMESH_SERVER_CERT_PATH=%s/kmesh-mtls/server-cert.pem\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'KMESH_SERVER_KEY_PATH=%s/kmesh-mtls/server-key.pem\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'KMESH_CLIENT_CERT_PATH=%s/kmesh-mtls/client-cert.pem\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'KMESH_CLIENT_KEY_PATH=%s/kmesh-mtls/client-key.pem\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Generate test mTLS certificates
        run: scripts/generate-mtls-certs.sh "$RUNNER_TEMP/kmesh-mtls"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked --all-targets

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            install-musl: true
            binary: kmesh
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            install-musl: true
            binary: kmesh
          - os: macos-15
            target: aarch64-apple-darwin
            install-musl: false
            binary: kmesh
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            install-musl: false
            binary: kmesh.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Set mTLS input paths
        shell: bash
        run: |
          printf 'KMESH_CA_CERT_PATH=%s/kmesh-mtls/ca-cert.pem\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'KMESH_SERVER_CERT_PATH=%s/kmesh-mtls/server-cert.pem\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'KMESH_SERVER_KEY_PATH=%s/kmesh-mtls/server-key.pem\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'KMESH_CLIENT_CERT_PATH=%s/kmesh-mtls/client-cert.pem\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'KMESH_CLIENT_KEY_PATH=%s/kmesh-mtls/client-key.pem\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Generate test mTLS certificates for pull requests
        if: needs.resolve.outputs.mode == 'pull_request'
        shell: bash
        run: |
          certificate_dir="$RUNNER_TEMP/kmesh-mtls"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            certificate_dir="$(cygpath --unix "$certificate_dir")"
          fi
          scripts/generate-mtls-certs.sh "$certificate_dir"
      - name: Load trusted mTLS certificates
        if: needs.resolve.outputs.mode == 'release'
        env:
          KMESH_MTLS_CA_CERT: ${{ secrets.KMESH_MTLS_CA_CERT }}
          KMESH_MTLS_SERVER_CERT: ${{ secrets.KMESH_MTLS_SERVER_CERT }}
          KMESH_MTLS_SERVER_KEY: ${{ secrets.KMESH_MTLS_SERVER_KEY }}
          KMESH_MTLS_CLIENT_CERT: ${{ secrets.KMESH_MTLS_CLIENT_CERT }}
          KMESH_MTLS_CLIENT_KEY: ${{ secrets.KMESH_MTLS_CLIENT_KEY }}
        shell: bash
        run: |
          set -eu
          umask 077
          : "${KMESH_MTLS_CA_CERT:?KMESH_MTLS_CA_CERT is required}"
          : "${KMESH_MTLS_SERVER_CERT:?KMESH_MTLS_SERVER_CERT is required}"
          : "${KMESH_MTLS_SERVER_KEY:?KMESH_MTLS_SERVER_KEY is required}"
          : "${KMESH_MTLS_CLIENT_CERT:?KMESH_MTLS_CLIENT_CERT is required}"
          : "${KMESH_MTLS_CLIENT_KEY:?KMESH_MTLS_CLIENT_KEY is required}"
          mkdir -m 700 "$RUNNER_TEMP/kmesh-mtls"
          printf '%s' "$KMESH_MTLS_CA_CERT" > "$RUNNER_TEMP/kmesh-mtls/ca-cert.pem"
          printf '%s' "$KMESH_MTLS_SERVER_CERT" > "$RUNNER_TEMP/kmesh-mtls/server-cert.pem"
          printf '%s' "$KMESH_MTLS_SERVER_KEY" > "$RUNNER_TEMP/kmesh-mtls/server-key.pem"
          printf '%s' "$KMESH_MTLS_CLIENT_CERT" > "$RUNNER_TEMP/kmesh-mtls/client-cert.pem"
          printf '%s' "$KMESH_MTLS_CLIENT_KEY" > "$RUNNER_TEMP/kmesh-mtls/client-key.pem"
          chmod 600 "$RUNNER_TEMP/kmesh-mtls/ca-cert.pem" "$RUNNER_TEMP/kmesh-mtls/server-cert.pem" "$RUNNER_TEMP/kmesh-mtls/server-key.pem" "$RUNNER_TEMP/kmesh-mtls/client-cert.pem" "$RUNNER_TEMP/kmesh-mtls/client-key.pem"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl linker
        if: matrix.install-musl
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Verify the dependency graph has no OpenSSL TLS packages
        shell: bash
        run: |
          if cargo tree --locked --target "${{ matrix.target }}" --prefix none --format '{p}' \
            | grep -E '^[[:space:]]*(openssl-sys|openssl|openssl-src|native-tls)[[:space:]]v'; then
            echo 'An OpenSSL or native-tls package entered the dependency graph.'
            exit 1
          fi
      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: kmesh-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: needs.resolve.outputs.mode == 'release'
    needs: [resolve, verify, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Verify release tag matches the package version
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "kmesh") | .version')"
          test "$RELEASE_TAG" = "v$package_version" || {
            echo "Release tag $RELEASE_TAG does not match package version v$package_version." >&2
            exit 1
          }
      - name: Package platform binaries
        shell: bash
        run: |
          mkdir release-assets
          for target in \
            x86_64-unknown-linux-musl \
            aarch64-unknown-linux-musl \
            aarch64-apple-darwin; do
            chmod +x "release-artifacts/kmesh-${target}/kmesh"
            tar -C "release-artifacts/kmesh-${target}" \
              -czf "release-assets/kmesh-${target}.tar.gz" kmesh
          done
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          binary = Path("release-artifacts/kmesh-x86_64-pc-windows-msvc/kmesh.exe")
          with ZipFile("release-assets/kmesh-x86_64-pc-windows-msvc.zip", "w", ZIP_DEFLATED) as archive:
              archive.write(binary, binary.name)
          PY
      - name: Upload binaries to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --repo "$GH_REPO" --clobber
