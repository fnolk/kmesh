name: Rust CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            install-musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            install-musl: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
            install-musl: false
          - os: macos-15
            target: aarch64-apple-darwin
            install-musl: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl linker
        if: matrix.install-musl
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Verify the dependency graph has no OpenSSL backend
        shell: bash
        run: |
          if cargo tree --locked --target "${{ matrix.target }}" -e features | grep -Ei 'openssl|native-tls'; then
            echo 'OpenSSL or native-tls entered the dependency graph.'
            exit 1
          fi
      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Test on x86_64 Linux musl
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo test --locked --all-targets --target "${{ matrix.target }}"
