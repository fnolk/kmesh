# The public IP address or hostname of the kmesh server. Do not include a scheme.
server_addr = "kmesh.example.com"
server_port = 9443

# Defaults to ~/.cache/kmesh. Paths beginning with ~/ expand from your home directory;
# relative paths resolve from the directory containing this config file.
data_dir = "~/.cache/kmesh"

# Local session namespace. Saved access and refresh tokens are scoped by server, profile, and username.
profile = "default"

[auth]
# Choose one login method. Login fields may also be supplied on the CLI.
# method = "token"
# token = "paste-an-api-token-here"
# KMESH_TOKEN overrides auth.token; --token has the highest priority.
# For SSH signature login, configure these instead:
# method = "public-key"
# username = "your-account"
# key = "~/.ssh/id_ed25519"

[server]
# Address used by the server's HTTPS and QAD listeners.
bind_addr = "0.0.0.0"
udp_port = 3478
disable_private_relay = false
